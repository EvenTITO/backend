services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file:
      # The .env file takes precedence. If some variable is not set,
      # the .env.example file is used for the missing variables.
      - .env
      - .env.example
    volumes:
      - .:/code
    ports:
      - "8080:8080"
      - "5678:5678"  # Debug port
    command: uvicorn app.main:app --host=0.0.0.0 --port=8080 --reload
    restart: on-failure
    networks:
      - eventito-dev-network
    depends_on:
      postgres:
        condition: service_healthy
      init-gcs:
        condition: service_completed_successfully
    environment:
      - GCP_EMULATOR_HOST=http://fake-gcs:4443
      - GCP_EMULATOR_PUBLIC_HOST=http://localhost:4443

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-public-host", "localhost:4443"]
    ports:
      - "4443:4443"
    volumes:
      - ./gcs_data:/storage
    networks:
      - eventito-dev-network

  init-gcs:
    image: curlimages/curl:latest
    depends_on:
      fake-gcs:
        condition: service_started
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/init_gcs_emulator.sh"]
    networks:
      - eventito-dev-network

  postgres:
    image: postgres:14
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
      - PG_USER=postgres
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - eventito-dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  eventito-dev-network:
    name: eventito-dev-network
    external: true
